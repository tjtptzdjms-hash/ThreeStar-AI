name: Update ThreeStar Data

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每天 22:20 = UTC 14:20
    - cron: "20 14 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Update ThreeStar data
        run: python update.py

      - name: Settle predictions
        env:
          DRY_RUN: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python settle.py

      - name: Commit updated data
        run: |
          git config user.name "ThreeStar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add draws.csv

          if [ "${{ github.event_name }}" = "schedule" ]; then
            git add predictions.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Auto update and settle ThreeStar"
          git push origin HEAD:main
