
name: ThreeStar Daily Prediction

on:
  workflow_dispatch:
  schedule:
    # Taiwan 12:00 = UTC 04:00
    - cron: "0 4 * * 1-6"

permissions:
  contents: write

concurrency:
  group: threestar-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check prediction mode
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "DRY_RUN: $DRY_RUN"
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: Generate prediction
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: python predict.py

      - name: Save predictions
        run: |
          git add predictions.csv

          if git diff --cached --quiet; then
            echo "No new predictions"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Save daily ThreeStar prediction"
          git pull --rebase origin main
          git push origin HEAD:main
